apiVersion: batch/v1
kind: Job
metadata:
  name: head-cracker-build
  namespace: head-cracker
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: head-cracker
        app.kubernetes.io/component: builder
    spec:
      restartPolicy: Never
      nodeSelector:
        ichoronium.io/persistent-storage: "true"
      initContainers:
        - name: checkout
          image: alpine/git:latest
          command:
            - sh
            - -ec
          args:
            - |
              git clone --depth 1 --branch main https://github.com/cyberfab007/head-cracker.git /workspace/repo
              git -C /workspace/repo rev-parse HEAD
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: build
          image: moby/buildkit:latest
          command:
            - sh
            - -ec
          args:
            - |
              echo "Building Laravel image..."
              buildctl --addr tcp://buildkit.build-system.svc.cluster.local:1234 build \
                --frontend dockerfile.v0 \
                --local context=/workspace/repo/laravel \
                --local dockerfile=/workspace/repo/laravel \
                --output type=image,name=10.50.0.4:5000/head-cracker-web:latest,push=true

              echo "Building engine image..."
              buildctl --addr tcp://buildkit.build-system.svc.cluster.local:1234 build \
                --frontend dockerfile.v0 \
                --local context=/workspace/repo/engine \
                --local dockerfile=/workspace/repo/engine \
                --output type=image,name=10.50.0.4:5000/head-cracker-engine:latest,push=true

              echo "HeadCracker images pushed successfully."
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir: {}
